name: Format Source Once

on:
  push:
    branches: [fix/final-ci]
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/final-ci
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm install
      - run: npm run format
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git add src
          git add src-tauri
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize source'
            git push origin HEAD:fix/final-ci
          fi
