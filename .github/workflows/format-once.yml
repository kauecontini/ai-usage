name: Format Source Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm install
      - run: npm run format
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated formatting and lockfiles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src src-tauri Cargo.lock 2>/dev/null || true
          git add src-tauri/Cargo.lock 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'style: format source and lock dependencies'
            git push origin HEAD:main
          fi
