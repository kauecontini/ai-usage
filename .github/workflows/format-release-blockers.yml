name: Format Release Blockers Once

on:
  push:
    branches: [fix/release-blockers]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-blockers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/src/lib.rs; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git commit -m 'style: format release blocker fix'
          git push
